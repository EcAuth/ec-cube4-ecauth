# 設定画面
ecauth_login43.admin.config.title: EcAuth 設定
ecauth_login43.admin.config.sub_title: プラグイン設定
ecauth_login43.admin.config.signup.header: Client ID / Client Secret の取得方法
ecauth_login43.admin.config.signup.intro: 本プラグインのご利用には、EcAuth が発行する Client ID と Client Secret が必要です。まだお持ちでない場合は、以下の手順で取得してください。管理者 5 ユーザーまで無料でご利用いただけます。
ecauth_login43.admin.config.signup.first_time.header: はじめて EcAuth をご利用の場合
ecauth_login43.admin.config.signup.first_time.step1: 下の「EcAuth に申し込む」ボタンから申込フォームを開き、メールアドレスとサイトの情報を入力します。
ecauth_login43.admin.config.signup.first_time.step2: 入力したメールアドレス宛に確認メールが届きます。メール内のリンクを開くと、EcAuth のアカウントが作成されます。
ecauth_login43.admin.config.signup.first_time.step3: EcAuth のマイページに Client ID と Client Secret が表示されます。これを下の「EcAuth 接続設定」に入力し、「登録」ボタンを押してください。
ecauth_login43.admin.config.signup.link: EcAuth に申し込む
ecauth_login43.admin.config.signup.registered.header: すでにお申し込み済みの場合
ecauth_login43.admin.config.signup.registered.description: 申込は不要です。EcAuth のマイページを開くと、ご契約中のショップの Client ID と Client Secret を確認できます。Client Secret が分からなくなった場合は、マイページから再発行できます。
ecauth_login43.admin.config.signup.mypage.link: EcAuth マイページを開く
ecauth_login43.admin.config.header: EcAuth 接続設定
ecauth_login43.admin.config.ecauth_base_url: EcAuth URL
ecauth_login43.admin.config.ecauth_base_url.help: 通常は未入力で構いません。Client ID から自動解決されます。ステージング・開発環境では直接 URL を指定できますが、許可されたホスト（既定では ec-auth.io のサブドメイン）のみ登録できます。
ecauth_login43.admin.config.client_id: Client ID
ecauth_login43.admin.config.client_secret: Client Secret
ecauth_login43.admin.config.rp_id: RP ID
ecauth_login43.admin.config.rp_id.help: 未設定の場合、サイトのホスト名が使用されます。
ecauth_login43.admin.config.advanced_settings: 高度な設定
ecauth_login43.admin.config.advanced_settings.help: 通常は変更不要です。ステージング・開発環境や RP ID のカスタマイズが必要な場合のみ使用してください。
ecauth_login43.admin.config.client_resolve.failed: Client ID に対応するテナントが見つかりませんでした。Client ID を確認するか、高度な設定で EcAuth URL を直接指定してください。
ecauth_login43.admin.config.base_url.not_allowed: EcAuth URL が許可されていないホストを指しています。https で始まる正しい EcAuth の URL を指定してください。開発・ステージング環境のホストを使う場合は、環境変数 ECAUTH_ALLOWED_HOSTS に追加してください。
ecauth_login43.admin.config.required: 必須
ecauth_login43.admin.config.save: 登録
ecauth_login43.admin.config.back: 戻る
ecauth_login43.admin.config.save.success: 設定を保存しました。
ecauth_login43.admin.config.next_step.header: 次のステップ
ecauth_login43.admin.config.next_step.description.ready: 接続設定が完了しました。続けて管理者用のパスキーを登録すると、管理画面にパスキーでログインできるようになります。
ecauth_login43.admin.config.next_step.description.pending: 接続設定を保存すると、管理者用パスキーの登録に進めます。
ecauth_login43.admin.config.next_step.link: パスキーを登録する

