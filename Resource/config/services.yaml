parameters:
    ecauth_auth_js_version: 'latest'
    # Client Resolve API の Discovery URL デフォルト値。
    # 環境変数 ECAUTH_CLIENT_RESOLVE_URL が設定されていればそちらが優先される。
    ecauth_default_discovery_url: 'https://api.ec-auth.io'
    # 設定画面に表示する申込 / マイページ導線の URL デフォルト値。
    # Hugo 生成の実 URL に合わせて末尾スラッシュ付き (無いと 301 が挟まる)。
    # 環境変数 ECAUTH_SIGNUP_URL / ECAUTH_MYPAGE_URL が設定されていればそちらが優先される。
    ecauth_default_signup_url: 'https://ec-auth.io/signup/'
    ecauth_default_mypage_url: 'https://ec-auth.io/mypage/'
    # EcAuth Base URL として許可するホストのリスト（カンマ区切り）。
    # Base URL はトークン交換先かつ JWKS の取得先になるため、設定汚染や
    # client-resolve 応答の改竄で攻撃者のホストに向かないよう許可リストで縛る
    # （EcAuthDocs #101）。
    # 環境変数 ECAUTH_ALLOWED_HOSTS が設定されていればそちらが優先される。
    # ec-auth.io 配下に無い開発・ステージング環境を使う場合は、環境変数側に
    # 「完全なホスト名」を追加すること。共有ホスティングのサフィックス
    # （.azurewebsites.net 等）を許可すると、そのサービスの全利用者を信頼する
    # ことになり本検証の意味が失われる。書式は BaseUrlValidator の docblock を参照。
    ecauth_default_allowed_hosts: '.ec-auth.io'
    # 管理画面のパスワード認証を無効化するかどうかの既定値。
    # 環境変数 ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN が設定されていればそちらが優先される
    # (1 / true / on / yes で無効化、未設定・0・空文字なら従来どおりパスワードでログインできる)。
    #
    # 意図的にプラグイン設定 (DB) ではなく環境変数に置いている。管理画面から切り替えられると、
    # 乗っ取られた時点でパスワード認証を戻されてしまい守りにならないため。
    # 環境変数名は Service/AdminPasswordLoginPolicy::ENV_NAME にも定数として持っている
    # (設定画面と README に表示するため)。変更するときは両方を直すこと。
    ecauth_default_disable_admin_password_login: false

services:
    Plugin\EcAuthLogin43\:
        resource: '../../*'
        exclude: '../../{Entity,Resource,Tests,tests}'
        autowire: true
        autoconfigure: true
        bind:
            $ecauth_auth_js_version: '%ecauth_auth_js_version%'
            $discoveryUrl: '%env(default:ecauth_default_discovery_url:ECAUTH_CLIENT_RESOLVE_URL)%'
            $signupUrl: '%env(default:ecauth_default_signup_url:ECAUTH_SIGNUP_URL)%'
            $mypageUrl: '%env(default:ecauth_default_mypage_url:ECAUTH_MYPAGE_URL)%'
            $allowedHosts: '%env(default:ecauth_default_allowed_hosts:ECAUTH_ALLOWED_HOSTS)%'
            $eccubeTimezone: '%timezone%'

    # 管理画面のパスワード認証を無効化するかどうか。
    # bind: に $disabled を置くと同名の引数を持つ他サービスまで巻き込むため、
    # このサービスの arguments で直接指定する。
    Plugin\EcAuthLogin43\Service\AdminPasswordLoginPolicy:
        autowire: true
        autoconfigure: true
        arguments:
            $disabled: '%env(default:ecauth_default_disable_admin_password_login:bool:ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN)%'

    # パスワード認証を実際に塞ぐリスナー。
    # FirewallMap (security.firewall.map) は型でオートワイヤできないためサービス ID で渡す。
    Plugin\EcAuthLogin43\Security\AdminPasswordLoginListener:
        autowire: true
        autoconfigure: true
        arguments:
            $firewallMap: '@security.firewall.map'

    # JWKS プロバイダ。キャッシュは EC-CUBE 本体の cache.app (PSR-6) を使う。
    Plugin\EcAuthLogin43\Service\JwksProviderInterface:
        alias: Plugin\EcAuthLogin43\Service\CachedJwksProvider

    # resource 読み込みで登録された定義を上書きするため、autowire / autoconfigure を明示する。
    Plugin\EcAuthLogin43\Service\CachedJwksProvider:
        autowire: true
        autoconfigure: true
        arguments:
            $cache: '@cache.app'

    # PSR-18 HTTP クライアント
    # EC-CUBE 4.2+ は本体が guzzlehttp/guzzle:^7 を依存として持つため Guzzle にエイリアス。
    # 実装を差し替える場合は本エントリの class のみ変更する。
    Psr\Http\Client\ClientInterface:
        class: GuzzleHttp\Client
        arguments:
            - { timeout: 30, http_errors: false }

    # PSR-17 Request / Stream ファクトリ (GuzzleHttp\Psr7\HttpFactory が両方を実装)
    Psr\Http\Message\RequestFactoryInterface:
        class: GuzzleHttp\Psr7\HttpFactory
    Psr\Http\Message\StreamFactoryInterface:
        class: GuzzleHttp\Psr7\HttpFactory

eccube:
    rate_limiter:
        ecauth_passkey_authenticate:
            route: ecauth_passkey_authenticate_options
            method: ['POST']
            type: ['ip']
            limit: 10
            interval: '60 minutes'
