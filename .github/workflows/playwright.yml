name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      install_source:
        description: 'プラグインのインストール元'
        type: choice
        options:
          - local
          - package-api
        default: local
      plugin_version:
        description: 'package-api から入れるプラグインのバージョン（空なら最新）'
        type: string
        required: false

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STAGING_CLIENT_ID: op://EcAuth/ecauth-staging-app/client_id
          STAGING_CLIENT_SECRET: op://EcAuth/ecauth-staging-app/client_secret
          STAGING_WEB_APP_SUFFIX: op://EcAuth/ecauth-staging-app/web_app_suffix

      # オーナーズストアの検証キー（X-ECCUBE-KEY）。
      # 設定されている場合のみ docker-entrypoint.sh が package-api から
      # 「申請中のパッケージ」をインストールする。既定（push / pull_request）では
      # このステップが動かないため、/plugin のローカルソースが使われる。
      # fork からの PR には secrets が無いので、この分岐は必須。
      - name: Load EC-CUBE verification key from 1Password
        if: ${{ inputs.install_source == 'package-api' }}
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ECCUBE_AUTHENTICATION_KEY: op://EcAuth/eccube4-ecauth-plugin/eccube_authentication_key

      - name: Start Docker environment
        # ECCUBE_AUTHENTICATION_KEY は直前のステップが export-env で job の env に載せる
        # （そのステップが動かなければ未設定のまま）。docker compose はそれを継承するので
        # ここで再指定はしない。未設定＝ローカルソースからのインストール。
        run: docker compose up -d --build --wait
        env:
          ECAUTH_PLUGIN_VERSION: ${{ inputs.plugin_version }}
          # E2E は staging の EcAuth を指すため、プラグイン既定の許可ホスト
          # (.ec-auth.io) だけでは設定を保存できない。
          # .azurewebsites.net のようなサフィックス指定にはしないこと。
          # 共有ホスティングのサフィックスを許可すると Azure の全利用者を
          # 信頼することになり、本修正 (EcAuthDocs #101) の意味が失われる。
          ECAUTH_ALLOWED_HOSTS: .ec-auth.io,ecauth-staging-${{ env.STAGING_WEB_APP_SUFFIX }}.azurewebsites.net

      - name: Wait for EC-CUBE to be ready
        run: |
          ready=false
          for i in $(seq 1 30); do
            if curl -sk https://localhost:8081/admin/login > /dev/null 2>&1; then
              echo "EC-CUBE is ready"
              ready=true
              break
            fi
            echo "Waiting for EC-CUBE... ($i/30)"
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "EC-CUBE did not become ready in time" >&2
            exit 1
          fi

      - name: Warm up staging EcAuth
        # staging の App Service は Free tier のため alwaysOn を有効化できず、
        # 一定時間アイドルだとワーカーがアンロードされる。コールドスタート中は
        # HTTP が遅いだけでなく TCP 接続自体が失敗しうる（実際に E2E が
        # cURL error 7 / 28 で落ちた）。Playwright を走らせる前に暖めておく。
        #
        # ここで落ちた場合は「staging が応答しない」ことが明確になり、
        # プラグイン側の不具合と切り分けられる。
        env:
          ECAUTH_BASE_URL: https://ecauth-staging-${{ env.STAGING_WEB_APP_SUFFIX }}.azurewebsites.net
        run: |
          ready=false
          for i in $(seq 1 10); do
            # 接続失敗時も curl は -w で 000 を出力するため、ここで既定値を足すと
            # 000000 のように連結されてしまう。curl の出力をそのまま使う。
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${ECAUTH_BASE_URL}/healthz" || true)
            if [ "${code:-000}" = "200" ]; then
              echo "staging EcAuth is warm (attempt $i)"
              ready=true
              break
            fi
            echo "Waiting for staging EcAuth... ($i/10, http=${code:-000})"
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "::error::staging EcAuth did not become reachable; E2E cannot run" >&2
            exit 1
          fi

      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=list
        env:
          BASE_URL: https://localhost:8081
          ECAUTH_BASE_URL: https://ecauth-staging-${{ env.STAGING_WEB_APP_SUFFIX }}.azurewebsites.net
          CLIENT_ID: ${{ env.STAGING_CLIENT_ID }}
          CLIENT_SECRET: ${{ env.STAGING_CLIENT_SECRET }}
          RP_ID: localhost

      - name: Dump dtb_member on failure
        if: failure()
        run: |
          echo "=== dtb_member (id, login_id, ecauth_subject) ==="
          docker compose exec -T postgres psql -U eccube -d eccube_db -c \
            "SELECT id, login_id, ecauth_subject FROM dtb_member ORDER BY id;" || true

      - name: Collect EC-CUBE logs
        if: failure()
        run: |
          mkdir -p ec-cube-logs
          docker compose logs --no-color ec-cube > ec-cube-logs/ec-cube-stdout.log 2>&1 || true
          docker compose logs --no-color postgres > ec-cube-logs/postgres-stdout.log 2>&1 || true
          docker compose cp ec-cube:/var/www/html/var/log ec-cube-logs/var-log 2>/dev/null || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
            ec-cube-logs/
          retention-days: 7

      - name: Stop Docker environment
        if: always()
        run: docker compose down
