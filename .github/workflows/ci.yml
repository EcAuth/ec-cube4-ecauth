name: CI

on:
  push:
    branches: [4.0]
  pull_request:
    branches: [4.0]

jobs:
  # EC-CUBE 4.0 は PHP 7.1.3 以上をサポートするため、7.1 で読み込めることを担保する。
  #
  # ユニットテストを 7.1 で回せれば理想だが、phpunit ^9.6 の下限が 7.3、
  # php-cs-fixer ^3 の下限が 7.4 で、7.1 では composer install 自体が通らない。
  # 構文だけなら php -l で確認できるので、下限側はこのジョブが受け持つ。
  # 「7.4 では通るが 7.1 では Parse error」になる代表格は末尾カンマ
  # (関数呼び出しは 7.3+、関数定義は 8.0+)。
  php-syntax:
    name: PHP Syntax (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.1', '7.2', '7.3']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all PHP files
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=${file}::${output}"
              status=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0)
          exit $status

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: echo "PHPStan is temporarily skipped due to missing EC-CUBE/Symfony stubs"
        # run: vendor/bin/phpstan analyse --no-progress

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run --config Tests/rector.php

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 は EC-CUBE 4.0/4.1 を実際に動かす版 (Docker 環境と揃えてある)。
        # 8.3 は上限側の互換確認。7.1〜7.3 は php-syntax ジョブが受け持つ
        # (phpunit ^9.6 の下限が 7.3、php-cs-fixer ^3 の下限が 7.4 のため、
        #  それ未満では composer install が通らない)。
        php-version: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config Tests/.php-cs-fixer.dist.php
