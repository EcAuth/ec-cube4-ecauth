version: 2

updates:
  # GitHub Actions の自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    # このブランチは 4.0/4.1 系専用。既定のままだと
    # default branch (main = 4.2/4.3 版) に PR が出てしまう。
    target-branch: "4.0"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    # minor/patch と major の 2 PR に集約する。
    # patterns を "*" にしているのは、サードパーティ actions
    # （anthropics/* 1password/* shivammathur/* softprops/* pnpm/* 等）を
    # 取りこぼさないため。
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Composer パッケージの自動更新
  # require は ec-cube/plugin-installer のみ、require-dev は静的解析・テスト
  # ツール（phpstan / rector / php-cs-fixer / phpunit）。いずれも major 更新の
  # 影響は CI（rector / cs-fixer / phpunit）が検出できるため minor/patch と
  # major の 2 PR に集約する。
  #
  # 注意 1: このプラグインは PHP 7.1 互換を維持する必要がある
  # （CLAUDE.md「コーディング規約」参照）。major 更新 PR をマージする前に
  # rector.php の phpVersion 固定と .php-cs-fixer.dist.php の設定が
  # 引き続き 7.1 互換を保っているか確認すること。
  #
  # 注意 2: require に ec-cube/plugin-installer 以外を足してはいけない。
  # EC-CUBE 4.0 系は Composer v1 のメタデータ提供が終了しており、依存を持つ
  # プラグインは利用者側で本体 composer.json に vcs リポジトリを書き足さないと
  # インストールできなくなる（https://doc4.ec-cube.net/plugin_eccube40）。
  - package-ecosystem: "composer"
    directory: "/"
    # このブランチは 4.0/4.1 系専用。既定のままだと
    # default branch (main = 4.2/4.3 版) に PR が出てしまう。
    target-branch: "4.0"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "composer"
    commit-message:
      prefix: "chore"
      include: "scope"
    allow:
      - dependency-type: "all"
    groups:
      composer-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      composer-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # npm パッケージの自動更新
  - package-ecosystem: "npm"
    directory: "/"
    # このブランチは 4.0/4.1 系専用。既定のままだと
    # default branch (main = 4.2/4.3 版) に PR が出てしまう。
    target-branch: "4.0"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    allow:
      - dependency-type: "all"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
