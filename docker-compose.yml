networks:
  backend:
    driver: bridge

volumes:
  pg-database:
    driver: local

services:
  ec-cube:
    build:
      context: .
      args:
        # 検証対象の EC-CUBE。4.1 系を試すときは ECCUBE_VERSION=4.1.2-p5 を渡す。
        # composer のメジャーバージョン (4.0 は v1 / 4.1 は v2) は Dockerfile が
        # ECCUBE_VERSION から自動で決めるので、ここで指定するのはこの 1 つだけでよい。
        ECCUBE_VERSION: ${ECCUBE_VERSION:-4.0.6-p5}
        PHP_TAG: ${PHP_TAG:-7.4-apache-bullseye}
    ports:
      - "8080:80"
      - "8081:443"
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "postgresql://eccube:password@postgres:5432/eccube_db"
      # PostgreSQL は 4.0/4.1 のサポート範囲に寄せて 12 を使う。
      # doctrine/dbal 2.9〜2.13 は新しい PostgreSQL のバージョン検出を持たないため、
      # 4.2/4.3 版と同じ 15 にはしない。
      DATABASE_SERVER_VERSION: 12
      # 4.0/4.1 のメール送信は swiftmailer。4.2 以降の MAILER_DSN ではなく MAILER_URL。
      MAILER_URL: "null://localhost"
      # EcAuth Base URL として許可するホスト（カンマ区切り）。
      # dev / staging の EcAuth は ec-auth.io 配下に無いため、そこへ繋ぐ場合は
      # ECAUTH_ALLOWED_HOSTS に「完全なホスト名」を足すこと（.env.tpl 参照）。
      # .azurewebsites.net のようなサフィックス指定にはしないこと。共有ホスティングの
      # サフィックスを許可すると、そのサービスの全利用者を信頼することになり、
      # EcAuthDocs #101 の修正の意味が失われる。
      ECAUTH_ALLOWED_HOSTS: ${ECAUTH_ALLOWED_HOSTS:-.ec-auth.io}
      # 管理画面のパスワード認証を無効化するか（1 / true / on / yes で無効）。
      # 未設定なら従来どおり ID とパスワードでログインできる。
      # 無効化すると、管理者はパスキーでしかログインできなくなる。パスキーを
      # 紛失したときはこの値を外して起動し直せばパスワードでログインできる。
      ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN: ${ECAUTH_DISABLE_ADMIN_PASSWORD_LOGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:12-alpine
    environment:
      TZ: Asia/Tokyo
      POSTGRES_DB: eccube_db
      POSTGRES_USER: eccube
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - pg-database:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: pg_isready -U eccube -d eccube_db
      interval: 3s
      timeout: 3s
      retries: 10
